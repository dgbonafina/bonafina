<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Generador de subtítulos por palabra</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Subtítulos automáticos (1 o 2 palabras por línea)</h1>
      <p>
        Subí un video, elegí formatos y generá subtítulos sincronizados para reels, shorts o clips.
      </p>

      <form id="subtitleForm" class="card">
        <label>
          Video
          <input type="file" id="video" name="video" accept="video/*" required />
        </label>

        <label>
          Idioma (opcional, ejemplo: es, en)
          <input type="text" id="language" name="language" placeholder="es" />
        </label>

        <label>
          Palabras por línea
          <select id="words_per_cue" name="words_per_cue">
            <option value="1">1 palabra</option>
            <option value="2" selected>2 palabras</option>
          </select>
        </label>

        <fieldset>
          <legend>Formatos de salida</legend>
          <label><input type="checkbox" name="formats" value="srt" checked /> SRT</label>
          <label><input type="checkbox" name="formats" value="vtt" checked /> VTT</label>
          <label><input type="checkbox" name="formats" value="ass" checked /> ASS</label>
          <label><input type="checkbox" name="formats" value="json" /> JSON</label>
        </fieldset>

        <button type="submit" id="submitBtn">Generar subtítulos</button>
      </form>

      <p id="status" class="status"></p>
    </main>

    <script>
      const form = document.getElementById('subtitleForm');
      const statusEl = document.getElementById('status');
      const submitBtn = document.getElementById('submitBtn');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const file = document.getElementById('video').files[0];
        const wordsPerCue = document.getElementById('words_per_cue').value;
        const language = document.getElementById('language').value.trim();
        const formatInputs = [...document.querySelectorAll('input[name="formats"]:checked')];

        if (!file) {
          statusEl.textContent = 'Seleccioná un archivo de video.';
          return;
        }

        if (formatInputs.length === 0) {
          statusEl.textContent = 'Seleccioná al menos un formato de salida.';
          return;
        }

        const body = new FormData();
        body.append('video', file);
        body.append('words_per_cue', wordsPerCue);
        if (language) body.append('language', language);
        formatInputs.forEach((item) => body.append('formats', item.value));

        submitBtn.disabled = true;
        statusEl.textContent = 'Procesando video... esto puede tardar unos minutos.';

        try {
          const response = await fetch('/api/generate-subtitles', {
            method: 'POST',
            body,
          });

          if (!response.ok) {
            const message = await response.text();
            throw new Error(message || 'Error generando subtítulos');
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = 'subtitulos.zip';
          document.body.appendChild(a);
          a.click();
          a.remove();
          URL.revokeObjectURL(url);

          statusEl.textContent = 'Listo. Se descargó un ZIP con tus subtítulos.';
        } catch (error) {
          statusEl.textContent = `No se pudo procesar el video: ${error.message}`;
        } finally {
          submitBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
